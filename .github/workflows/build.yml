name: Build CMD CLIENT

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mc: ["1.21.1", "1.21.4", "1.21.8", "1.21.11", "26.3"]
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          echo "Files in repo:"; find . -path ./.git -prune -o -type f -print | head -50
          ZIP=$(find . -iname '*.zip' -not -path './.git/*' | head -n1)
          if [ -z "$ZIP" ]; then echo "NO ZIP FOUND in repo - upload cmd-client-source.zip"; exit 1; fi
          echo "Using: $ZIP"
          unzip -q "$ZIP"
          ls

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.mc == '26.3' && '25' || '21' }}

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.1"

      - name: Generate core mod project
        run: python3 cmd-client/scripts/prepare.py ${{ matrix.mc }}

      - name: Compile core mod
        run: gradle -p cmd-client/work/${{ matrix.mc }} build --no-daemon

      - name: Assemble single jar (mods embedded)
        run: |
          CORE=$(ls cmd-client/work/${{ matrix.mc }}/build/libs/*.jar | grep -v -- '-sources' | grep -v -- '-dev' | head -n1)
          python3 cmd-client/scripts/assemble.py ${{ matrix.mc }} "$CORE" "cmd-client/dist/CMD-CLIENT-${{ matrix.mc }}.jar"

      - uses: actions/upload-artifact@v4
        with:
          name: CMD-CLIENT-${{ matrix.mc }}
          path: |
            cmd-client/dist/CMD-CLIENT-${{ matrix.mc }}.jar
            cmd-client/dist/fabric-api-${{ matrix.mc }}.jar
            cmd-client/dist/missing-${{ matrix.mc }}.txt
