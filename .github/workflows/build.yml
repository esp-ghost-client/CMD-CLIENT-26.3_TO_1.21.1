name: Build CMD CLIENT

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mc: ["1.21.1", "1.21.4", "1.21.8", "1.21.11", "26.3"]
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          ZIP=$(find . -iname '*.zip' -not -path './.git/*' | head -n1)
          if [ -z "$ZIP" ]; then echo "NO ZIP FOUND in repo"; exit 1; fi
          echo "Using: $ZIP"
          unzip -q "$ZIP"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.mc == '26.3' && '25' || '21' }}

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.1"

      - name: Generate core mod project
        shell: bash
        run: python3 cmd-client/scripts/prepare.py ${{ matrix.mc }}

      - name: Compile core mod
        id: compile
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gradle -p cmd-client/work/${{ matrix.mc }} build --no-daemon 2>&1 | tee cmd-client/build.log

      - name: Assemble single jar (mods embedded)
        shell: bash
        run: |
          CORE=$(ls cmd-client/work/${{ matrix.mc }}/build/libs/*.jar 2>/dev/null | grep -v -- '-sources' | grep -v -- '-dev' | head -n1 || true)
          if [ -z "$CORE" ]; then CORE=STUB; fi
          python3 cmd-client/scripts/assemble.py ${{ matrix.mc }} "$CORE" "cmd-client/dist/CMD-CLIENT-${{ matrix.mc }}.jar"

      - name: Report in Summary
        if: always()
        shell: bash
        run: |
          {
            echo "### ${{ matrix.mc }}: core compile = ${{ steps.compile.outcome }}"
            if [ "${{ steps.compile.outcome }}" != "success" ]; then
              echo '```'
              grep -E -A2 "error:" cmd-client/build.log | head -40 || true
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: CMD-CLIENT-${{ matrix.mc }}
          path: |
            cmd-client/dist/CMD-CLIENT-${{ matrix.mc }}.jar
            cmd-client/dist/fabric-api-${{ matrix.mc }}.jar
            cmd-client/dist/missing-${{ matrix.mc }}.txt
